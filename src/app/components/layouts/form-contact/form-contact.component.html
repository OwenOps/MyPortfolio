<div class="contact-us" [class.contact-us--embedded]="!showTitle">
  <div class="contact-us__form-container">
    @if (showTitle) {
      <h1>{{ 'PREFERENCES.Contact_Title' | translate }}</h1>
    }

    @if (isPhoneSize || isPhoneMode) {
      <app-social-media></app-social-media>
    }

    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      <p-floatlabel variant="in">
        <input id="contact-name" type="text" pInputText formControlName="name" autocomplete="name" />
        <label for="contact-name">
          {{ 'PREFERENCES.Name' | translate }}
          <span class="required">*</span>
        </label>
      </p-floatlabel>

      <p-floatlabel variant="in">
        <input id="contact-email" type="email" pInputText formControlName="email" autocomplete="email" />
        <label for="contact-email">
          {{ 'PREFERENCES.Email' | translate }}
          <span class="required">*</span>
        </label>
      </p-floatlabel>

      <p-floatlabel variant="in">
        <textarea pTextarea id="contact-message" rows="4" formControlName="message"></textarea>
        <label for="contact-message">
          {{ 'PREFERENCES.Message' | translate }}
          <span class="required">*</span>
        </label>
      </p-floatlabel>

      <div class="contact-us__actions">
        @if (!isLoading) {
          <button type="submit" pButton [label]="'PREFERENCES.Send' | translate"
            [disabled]="contactForm.invalid"></button>
        } @else {
          <app-custom-loading [isLoading]="isLoading"></app-custom-loading>
        }
      </div>
    </form>
  </div>
</div>
